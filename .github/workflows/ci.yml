name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── TypeScript: lint, test, build ────────────────────────────────────────
  build-and-test-ts:
    name: TypeScript — Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage)
        run: npm run test -- --ci --coverageReporters=lcov --coverageReporters=text-summary

      - name: Build
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: coverage/lcov.info

  # ── Python: lint and test ────────────────────────────────────────────────
  test-python:
    name: Python — Test Agent Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: agents/requirements.txt

      - name: Install dependencies
        run: pip install -r agents/requirements.txt

      - name: Run tests
        run: cd agents && python -m pytest tests/ -v --tb=short

  # ── Go: vet, build, test ─────────────────────────────────────────────────
  build-go:
    name: Go — Vet & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: interceptor/go.sum

      - name: Vet
        run: cd interceptor && go vet ./...

      - name: Build
        run: cd interceptor && CGO_ENABLED=0 go build -ldflags="-s -w" -v ./...

  # ── Dependency audit ─────────────────────────────────────────────────────
  audit-deps:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high

  # ── Docker image build (smoke test) ──────────────────────────────────────
  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [build-and-test-ts, test-python, build-go]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build control-plane image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: llm-security-control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build agents image
        uses: docker/build-push-action@v6
        with:
          context: ./agents
          file: ./agents/Dockerfile
          push: false
          tags: llm-security-agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build interceptor image
        uses: docker/build-push-action@v6
        with:
          context: ./interceptor
          file: ./interceptor/Dockerfile
          push: false
          tags: llm-security-interceptor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
